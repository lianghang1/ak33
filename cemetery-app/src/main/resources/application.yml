server:
  port: 8080

spring:
  application:
    name: cemetery-app
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cemetery?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  liquibase:
    enabled: true
    change-log: classpath:db/master.xml
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3000ms

# 平台初始化：首次启动幂等播种平台租户、超管账号、菜单
matrix:
  platform:
    admin:
      enabled: ${PLATFORM_ADMIN_ENABLED:true}
      username: ${PLATFORM_ADMIN_USER:admin}
      password: ${PLATFORM_ADMIN_PASSWORD:admin123}
      name: 平台管理员
    seed-menus: true

scaffold:
  tenant:
    enabled: true
  security:
    token:
      ttl-seconds: ${TOKEN_TTL_SECONDS:3600}
  web:
    access-log:
      enabled: true
    # 前后端分离部署必须配置 allowed-origins，否则浏览器跨域请求被拦（scaffold 默认关闭 CORS）
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
      allowed-methods: GET,POST
      allowed-headers: Authorization,X-Token,Content-Type
      max-age: 1800

logging:
  level:
    com.sfi.matrix: INFO
